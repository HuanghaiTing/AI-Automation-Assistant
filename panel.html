<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
            font-size: 13px;
            color: #fff;
            overflow: hidden;
            background: transparent;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background: rgba(30, 32, 38, 0.78);
            backdrop-filter: blur(30px) saturate(1.6);
            -webkit-backdrop-filter: blur(30px) saturate(1.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* ========== 标题栏 ========== */
        .titlebar {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

            .titlebar .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #4a9eff;
                margin-right: 10px;
                flex-shrink: 0;
                box-shadow: 0 0 10px #4a9eff;
                animation: pulse 1.6s ease-in-out infinite;
            }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 10px #4a9eff;
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 4px #4a9eff;
            }
        }

        .titlebar .title {
            font-size: 13px;
            font-weight: 600;
            color: #f0f0f0;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .titlebar .btn-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe MDL2 Assets", "Segoe Fluent Icons", sans-serif;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

            .titlebar .btn-close:hover {
                background: rgba(255, 255, 255, 0.1);
                color: #fff;
            }

        /* ========== 任务信息 ========== */
        .task-info {
            padding: 14px 16px 10px;
            flex-shrink: 0;
        }

            .task-info .label {
                font-size: 11px;
                color: #8a8a8a;
                margin-bottom: 6px;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                font-weight: 500;
            }

            .task-info .value {
                font-size: 13px;
                color: #e8e8e8;
                line-height: 1.5;
                word-break: break-all;
                max-height: 60px;
                overflow-y: auto;
            }

        /* ========== 进度 ========== */
        .progress-section {
            padding: 6px 16px 14px;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a9eff, #7ab8ff);
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9a9a9a;
            font-variant-numeric: tabular-nums;
        }

        /* ========== 日志 ========== */
        .log-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 12px;
        }

            .log-section .section-label {
                font-size: 11px;
                color: #8a8a8a;
                padding: 0 4px 8px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-weight: 500;
                flex-shrink: 0;
            }

        .log {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 14px;
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: 11.5px;
            line-height: 1.65;
            min-height: 0;
        }

            .log::-webkit-scrollbar {
                width: 6px;
            }

            .log::-webkit-scrollbar-track {
                background: transparent;
            }

            .log::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.15);
                border-radius: 3px;
            }

                .log::-webkit-scrollbar-thumb:hover {
                    background: rgba(255, 255, 255, 0.25);
                }

        .log-line {
            margin-bottom: 2px;
            word-break: break-all;
            color: #c8c8c8;
        }

            .log-line .ts {
                color: #6a6a6a;
                margin-right: 8px;
            }

            .log-line.info .msg {
                color: #d0d0d0;
            }

            .log-line.exec .msg {
                color: #4a9eff;
            }

            .log-line.ai .msg {
                color: #b088e0;
            }

            .log-line.uia .msg {
                color: #dcdcaa;
            }

            .log-line.error .msg {
                color: #ff6b6b;
            }

            .log-line.step .msg {
                color: #6ccb5f;
                font-weight: 600;
            }

        /* ========== 底部按钮 ========== */
        .actions {
            padding: 14px 16px 16px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        button.btn {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
            transition: background 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

            /* ★ 蓝色停止按钮 */
            button.btn.stop {
                background: rgba(74, 158, 255, 0.15);
                color: #4a9eff;
                border: 1px solid rgba(74, 158, 255, 0.4);
            }

                button.btn.stop:hover {
                    background: rgba(74, 158, 255, 0.25);
                    border-color: rgba(74, 158, 255, 0.6);
                }

                button.btn.stop:active {
                    transform: scale(0.98);
                    background: rgba(74, 158, 255, 0.35);
                }

                button.btn.stop:disabled {
                    opacity: 0.35;
                    cursor: not-allowed;
                    transform: none;
                }
    </style>
</head>
<body>

    <div class="titlebar" id="titlebar">
        <div class="dot" id="statusDot"></div>
        <span class="title" id="titleText">AI 正在执行任务</span>
        <button class="btn-close" id="btnClose">&#xE8BB;</button>
    </div>

    <div class="task-info">
        <div class="label">任务</div>
        <div class="value" id="taskText">-</div>
    </div>

    <div class="progress-section">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text">
            <span id="statusText">运行中...</span>
            <span id="stepText">0 / 12</span>
        </div>
    </div>

    <div class="log-section">
        <div class="section-label">实时日志</div>
        <div class="log" id="log"></div>
    </div>

    <div class="actions">
        <button class="btn stop" id="btnStop">■ 停止任务</button>
    </div>

    <script>
        "use strict";

        const $ = id => document.getElementById(id);
        const logEl = $("log");
        const taskText = $("taskText");
        const stepText = $("stepText");
        const statusText = $("statusText");
        const progressFill = $("progressFill");
        const statusDot = $("statusDot");
        const titleText = $("titleText");
        const btnStop = $("btnStop");
        const btnClose = $("btnClose");

        function send(obj) {
        if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(obj));
        }
        }

        function parseMessage(data) {
        if (typeof data === "string") {
        try { return JSON.parse(data); } catch (e) { return null; }
        }
        return data;
        }

        function appendLog(level, text) {
        const div = document.createElement("div");
        div.className = "log-line " + (level || "info");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        div.innerHTML = '<span class="ts">' + t + '</span><span class="msg"></span>';
        div.querySelector(".msg").textContent = text;
        logEl.appendChild(div);
        while (logEl.childElementCount > 200) logEl.removeChild(logEl.firstChild);
        logEl.scrollTop = logEl.scrollHeight;
        }

        function setStep(cur, total) {
        progressFill.style.width = (total > 0 ? (cur / total * 100) : 0) + "%";
        stepText.textContent = cur + " / " + total;
        }

        function setStatus(text) {
        statusText.textContent = text;
        }

        function reset() {
        logEl.innerHTML = "";
        progressFill.style.width = "0%";
        stepText.textContent = "0 / 12";
        setStatus("运行中...");
        titleText.textContent = "AI 正在执行任务";
        btnStop.disabled = false;
        statusDot.style.background = "#4a9eff";
        }

        if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener("message", e => {
        const m = parseMessage(e.data);
        if (!m) return;

        try {
        switch (m.type) {
        case "panelShow":
        reset();
        taskText.textContent = m.task || "-";
        break;
        case "log":
        appendLog(m.level, m.text);
        break;
        case "step":
        setStep(m.current, m.total);
        break;
        case "done":
        btnStop.disabled = true;
        if (m.success) {
        setStatus("✓ 完成");
        statusDot.style.background = "#6ccb5f";
        titleText.textContent = "任务完成";
        } else {
        setStatus("✗ 失败: " + (m.reason || "unknown"));
        statusDot.style.background = "#ff6b6b";
        titleText.textContent = "任务失败";
        }
        break;
        }
        } catch (err) {
        console.error("handle error:", err);
        }
        });
        }

        btnStop.addEventListener("click", () => {
        btnStop.disabled = true;
        setStatus("停止中...");
        send({ type: "panelStop" });
        });

        btnClose.addEventListener("click", () => {
        send({ type: "panelHide" });
        });

        console.log("[PANEL] ready");
    </script>
</body>
</html>
