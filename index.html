<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Automation Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
            font-size: 14px;
            color: #e8e8e8;
            overflow: hidden;
            background: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            background: rgba(20, 22, 28, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(60px) saturate(2.2) brightness(1.1);
            -webkit-backdrop-filter: blur(60px) saturate(2.2) brightness(1.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 0 rgba(255, 255, 255, 0.05), 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

            body::before {
                content: '';
                position: fixed;
                inset: -50%;
                background: radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.45), transparent 45%), radial-gradient(circle at 80% 70%, rgba(176, 136, 224, 0.45), transparent 45%), radial-gradient(circle at 50% 50%, rgba(108, 203, 95, 0.25), transparent 40%), radial-gradient(circle at 65% 25%, rgba(255, 118, 200, 0.3), transparent 40%);
                animation: auroraFloat 25s ease-in-out infinite;
                z-index: 0;
                filter: blur(80px);
                pointer-events: none;
                transition: opacity 0.4s;
            }

        @keyframes auroraFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }

            25% {
                transform: translate(-8%, 6%) rotate(90deg) scale(1.1);
            }

            50% {
                transform: translate(6%, -8%) rotate(180deg) scale(0.95);
            }

            75% {
                transform: translate(-4%, -4%) rotate(270deg) scale(1.05);
            }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent), radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent), radial-gradient(2px 2px at 50% 30%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.6), transparent), radial-gradient(1.5px 1.5px at 90% 40%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.3), transparent), radial-gradient(2px 2px at 85% 15%, rgba(255,255,255,0.5), transparent);
            background-size: 100% 100%;
            animation: starDrift 40s linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.4s;
        }

        @keyframes starDrift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-3%, -5%);
            }
        }

        /* ========== 模式：极光 ========== */
        body.mode-aurora {
            background: rgba(20, 22, 28, 0.4);
        }

            body.mode-aurora::before {
                opacity: 1;
            }

            body.mode-aurora::after {
                opacity: 0.7;
            }

        /* ========== 模式：Mica / Acrylic / Mica Alt ========== */
        body.mode-mica,
        body.mode-acrylic,
        body.mode-mica_alt {
            background: rgba(20, 22, 28, 0.15);
        }

            body.mode-mica::before,
            body.mode-acrylic::before,
            body.mode-mica_alt::before {
                opacity: 0;
            }

            body.mode-mica::after,
            body.mode-acrylic::after,
            body.mode-mica_alt::after {
                opacity: 0;
            }

        /* ========== 模式：纯色 ========== */
        body.mode-none {
            background: rgba(20, 22, 28, 0.95);
        }

            body.mode-none::before {
                opacity: 0;
            }

            body.mode-none::after {
                opacity: 0;
            }

        /* ========== 模式：自定义图片 ========== */
        body.mode-custom {
            background: rgba(20, 22, 28, 0.35);
        }

            body.mode-custom::before {
                content: '';
                position: fixed;
                inset: 0;
                background-image: var(--custom-bg, none);
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                animation: none;
                filter: none;
                z-index: 0;
                opacity: 1;
                pointer-events: none;
                border-radius: inherit;
            }

            body.mode-custom::after {
                content: '';
                position: fixed;
                inset: 0;
                background: rgba(20, 22, 28, 0.45);
                animation: none;
                z-index: 1;
                opacity: 1;
                pointer-events: none;
            }

        /* ========== 标题栏 ========== */
        .titlebar {
            height: 36px;
            display: flex;
            align-items: center;
            padding-left: 14px;
            user-select: none;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 10;
        }

            .titlebar .app-title {
                font-size: 13px;
                font-weight: 600;
                color: #d0d0d0;
                pointer-events: none;
                letter-spacing: 0.3px;
            }

            .titlebar .spacer {
                flex: 1;
                pointer-events: none;
            }

        .win-btns {
            display: flex;
            height: 36px;
        }

        .win-btn {
            width: 46px;
            height: 36px;
            border: none;
            background: transparent;
            color: #b8b8b8;
            font-family: "Segoe MDL2 Assets", "Segoe Fluent Icons", sans-serif;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s;
        }

            .win-btn:hover {
                background: rgba(255,255,255,0.08);
            }

            .win-btn.close:hover {
                background: #e81123;
                color: #fff;
            }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
            position: relative;
            z-index: 10;
        }

        /* ========== 左侧栏 ========== */
        .sidebar {
            width: 240px;
            background: rgba(20, 22, 28, 0.35);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.25s ease;
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
        }

            .sidebar.collapsed {
                width: 0;
                border-right: none;
                overflow: hidden;
            }

        .sidebar-header {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

            .sidebar-header .new-chat {
                flex: 1;
                height: 32px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                color: #e8e8e8;
                font-size: 13px;
                cursor: pointer;
                font-family: inherit;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 2px 8px rgba(0, 0, 0, 0.15);
                transition: background 0.15s, border-color 0.15s;
            }

                .sidebar-header .new-chat:hover {
                    background: rgba(255, 255, 255, 0.1);
                    border-color: rgba(255, 255, 255, 0.15);
                }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

            .sidebar-list::-webkit-scrollbar {
                width: 6px;
            }

            .sidebar-list::-webkit-scrollbar-thumb {
                background: rgba(255,255,255,0.08);
                border-radius: 3px;
            }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #b8b8b8;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s, transform 0.12s, color 0.15s;
            position: relative;
            animation: itemIn 0.25s ease-out;
        }

        @keyframes itemIn {
            from {
                opacity: 0;
                transform: translateX(-6px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(2px);
        }

        .chat-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .chat-item .time {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            display: block;
        }

        .chat-item .del {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
            padding: 0 4px;
            display: none;
        }

        .chat-item:hover .del {
            display: block;
        }

        .chat-item .del:hover {
            color: #ff6b6b;
        }

        /* ========== 中间聊天区 ========== */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            min-width: 0;
        }

        .chat-header {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            gap: 10px;
        }

            .chat-header .toggle-sidebar {
                width: 28px;
                height: 28px;
                border: none;
                background: transparent;
                color: #b8b8b8;
                cursor: pointer;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Segoe MDL2 Assets", sans-serif;
                font-size: 12px;
                transition: background 0.15s, color 0.15s;
            }

                .chat-header .toggle-sidebar:hover {
                    background: rgba(255, 255, 255, 0.08);
                    color: #e8e8e8;
                }

            .chat-header .model-name {
                flex: 1;
                font-size: 13px;
                color: #888;
                font-family: "Cascadia Code", monospace;
            }

            .chat-header .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #666;
                transition: background 0.2s;
            }

                .chat-header .status-dot.running {
                    background: #4a9eff;
                    animation: pulse 1.5s infinite;
                    box-shadow: 0 0 10px #4a9eff;
                }

                .chat-header .status-dot.done {
                    background: #6ccb5f;
                    box-shadow: 0 0 10px #6ccb5f;
                }

                .chat-header .status-dot.error {
                    background: #ff6b6b;
                    box-shadow: 0 0 10px #ff6b6b;
                }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ========== 消息流 ========== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            min-height: 0;
            scroll-behavior: smooth;
            background: transparent;
        }

            .messages::-webkit-scrollbar {
                width: 8px;
            }

            .messages::-webkit-scrollbar-thumb {
                background: rgba(255,255,255,0.08);
                border-radius: 4px;
            }

        .message {
            display: flex;
            padding: 12px 32px;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #4a9eff 0%, #2e7dd1 100%);
            order: 2;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #6ccb5f 0%, #4aa84a 100%);
        }

        .message .bubble {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.75) 0%, rgba(46, 125, 209, 0.75) 100%);
            color: #fff;
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 16px rgba(74, 158, 255, 0.3);
        }

        .message.ai .bubble {
            background: rgba(255, 255, 255, 0.06);
            color: #e8e8e8;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .message .bubble.error {
            background: rgba(58, 31, 31, 0.6);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff9999;
        }

        .message .bubble img {
            max-width: 240px;
            max-height: 240px;
            border-radius: 8px;
            display: block;
            margin-top: 6px;
        }

        /* ========== Win11 转圈 ========== */
        .win11-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

            .win11-spinner svg {
                width: 100%;
                height: 100%;
                animation: win11-spin 1.4s linear infinite;
            }

            .win11-spinner circle {
                fill: none;
                stroke: #4a9eff;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-dasharray: 1, 200;
                animation: win11-dash 1.5s ease-in-out infinite;
            }

        @keyframes win11-spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes win11-dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }

            50% {
                stroke-dasharray: 90, 200;
                stroke-dashoffset: -35;
            }

            100% {
                stroke-dasharray: 90, 200;
                stroke-dashoffset: -124;
            }
        }

        .message.ai .bubble.loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px 10px 16px;
        }

            .message.ai .bubble.loading .loading-text {
                color: #b8b8b8;
                font-size: 13px;
            }

        /* ========== 输入区 ========== */
        .input-area {
            padding: 16px 32px 24px;
            flex-shrink: 0;
            background: transparent;
        }

        .input-box {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 24px rgba(0, 0, 0, 0.2);
        }

            .input-box:focus-within {
                border-color: rgba(74, 158, 255, 0.6);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 0 3px rgba(74, 158, 255, 0.15), 0 4px 24px rgba(74, 158, 255, 0.2);
                background: rgba(255, 255, 255, 0.08);
            }

        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .attach-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .attach-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 12px;
            color: #b8b8b8;
            max-width: 200px;
            animation: chipIn 0.2s ease-out;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @keyframes chipIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .attach-chip .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attach-chip .x {
            cursor: pointer;
            color: #888;
            padding: 0 2px;
            transition: color 0.15s;
        }

            .attach-chip .x:hover {
                color: #ff6b6b;
            }

        textarea {
            width: 100%;
            min-height: 24px;
            max-height: 200px;
            resize: none;
            background: transparent;
            border: none;
            color: #e8e8e8;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            line-height: 1.5;
            transition: height 0.1s;
        }

            textarea::placeholder {
                color: #666;
            }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe MDL2 Assets", sans-serif;
            font-size: 13px;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }

            .icon-btn:hover {
                background: rgba(255, 255, 255, 0.08);
                color: #e8e8e8;
            }

            .icon-btn:active {
                transform: scale(0.92);
            }

        .send-btn {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border: none;
            background: linear-gradient(135deg, #4a9eff, #2e7dd1);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe MDL2 Assets", sans-serif;
            font-size: 14px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 12px rgba(74, 158, 255, 0.4);
        }

            .send-btn:hover {
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 20px rgba(74, 158, 255, 0.5);
            }

            .send-btn:active {
                transform: scale(0.92);
            }

            .send-btn:disabled {
                background: rgba(255, 255, 255, 0.08);
                color: #666;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            .send-btn.stop {
                background: rgba(255, 255, 255, 0.1);
                color: #4a9eff;
                box-shadow: none;
            }

                .send-btn.stop:hover {
                    background: rgba(255, 255, 255, 0.15);
                    box-shadow: none;
                }

        /* ========== 右侧日志 ========== */
        .right-panel {
            width: 340px;
            background: rgba(20, 22, 28, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.25s ease;
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
        }

            .right-panel.collapsed {
                width: 0;
                border-left: none;
                overflow: hidden;
            }

        .panel-title {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: 11px;
            line-height: 1.6;
            color: #b8b8b8;
            min-height: 0;
        }

            .log::-webkit-scrollbar {
                width: 6px;
            }

            .log::-webkit-scrollbar-thumb {
                background: rgba(255,255,255,0.08);
                border-radius: 3px;
            }

        .log-line {
            margin-bottom: 2px;
            word-break: break-all;
            animation: logIn 0.2s ease-out;
        }

        @keyframes logIn {
            from {
                opacity: 0;
                transform: translateX(-4px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-line .ts {
            color: #555;
            margin-right: 6px;
        }

        .log-line.exec .msg {
            color: #4a9eff;
        }

        .log-line.ai .msg {
            color: #b088e0;
        }

        .log-line.error .msg {
            color: #ff6b6b;
        }

        .log-line.step .msg {
            color: #6ccb5f;
            font-weight: 600;
        }

        /* ========== 设置 ========== */
        .settings-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: maskIn 0.2s ease-out;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        @keyframes maskIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .settings-panel {
            background: rgba(30, 32, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: panelIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(60px) saturate(2);
            -webkit-backdrop-filter: blur(60px) saturate(2);
        }

        @keyframes panelIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .settings-header h2 {
                font-size: 15px;
                font-weight: 600;
            }

        .settings-body {
            padding: 16px 20px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 14px;
        }

            .form-group label {
                display: block;
                font-size: 12px;
                color: #888;
                margin-bottom: 6px;
            }

            .form-group input, .form-group select {
                width: 100%;
                height: 36px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                color: #e8e8e8;
                padding: 0 12px;
                font-size: 13px;
                font-family: inherit;
                outline: none;
                transition: border-color 0.15s, background 0.15s;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }

                .form-group input:focus, .form-group select:focus {
                    border-color: rgba(74, 158, 255, 0.6);
                    background: rgba(255, 255, 255, 0.08);
                }

        .settings-footer {
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

            .settings-footer button {
                height: 36px;
                padding: 0 20px;
                border-radius: 10px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                font-family: inherit;
                border: none;
                transition: background 0.15s, box-shadow 0.15s;
            }

            .settings-footer .btn-cancel {
                background: rgba(255, 255, 255, 0.06);
                color: #b8b8b8;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

                .settings-footer .btn-cancel:hover {
                    background: rgba(255, 255, 255, 0.1);
                }

            .settings-footer .btn-save {
                background: linear-gradient(135deg, #4a9eff, #2e7dd1);
                color: #fff;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 12px rgba(74, 158, 255, 0.4);
            }

                .settings-footer .btn-save:hover {
                    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 20px rgba(74, 158, 255, 0.5);
                }

        #btnPickBg {
            width: 100%;
            height: 36px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

            #btnPickBg:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(74, 158, 255, 0.4);
            }
    </style>
</head>
<body class="mode-aurora">

    <div class="titlebar" id="titlebar">
        <span class="app-title">AI Automation Assistant</span>
        <div class="spacer"></div>
        <div class="win-btns">
            <button class="win-btn" id="btnSettings" title="Settings">&#xE713;</button>
            <button class="win-btn" id="btnMin" title="Minimize">&#xE921;</button>
            <button class="win-btn" id="btnMax" title="Maximize">&#xE922;</button>
            <button class="win-btn close" id="btnClose" title="Close">&#xE8BB;</button>
        </div>
    </div>

    <main>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat" id="newChat">＋ 新对话</button>
            </div>
            <div class="sidebar-list" id="chatList"></div>
        </aside>

        <section class="chat">
            <div class="chat-header">
                <button class="toggle-sidebar" id="toggleSidebar">&#xE700;</button>
                <span class="model-name" id="modelName">qwen-vl-max</span>
                <div class="status-dot" id="statusDot"></div>
                <button class="toggle-sidebar" id="toggleRight">&#xE700;</button>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <div class="input-box">
                    <div class="attachments" id="attachments">
                        <div class="attach-list" id="attachList"></div>
                    </div>
                    <textarea id="taskInput" placeholder="描述你的任务，或上传图片提问" rows="1"></textarea>
                    <div class="input-actions">
                        <button class="icon-btn" id="btnImage" title="上传图片">&#xEB9F;</button>
                        <button class="icon-btn" id="btnAttach" title="附加文件">&#xE723;</button>
                        <button class="icon-btn" id="btnPickFolder" title="选择文件夹">&#xE8B7;</button>
                        <button class="send-btn" id="sendBtn" title="Send">&#xE724;</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="right-panel" id="rightPanel">
            <div class="panel-title">运行日志</div>
            <div class="log" id="log"></div>
        </aside>

    </main>

    <div class="settings-mask" id="settingsMask" style="display:none;">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="icon-btn" id="settingsClose">&#xE8BB;</button>
            </div>
            <div class="settings-body">
                <div class="form-group">
                    <label>服务商</label>
                    <select id="cfgProvider">
                        <option value="qwen">通义千问 (Qwen)</option>
                        <option value="zhipu">智谱 GLM</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="openai">OpenAI</option>
                        <option value="moonshot">月之暗面 Kimi</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group"><label>API Key</label><input type="password" id="cfgApiKey"></div>
                <div class="form-group"><label>Base URL</label><input type="text" id="cfgBaseUrl"></div>
                <div class="form-group">
                    <label>模型</label>
                    <input type="text" id="cfgModel" list="modelList">
                    <datalist id="modelList"></datalist>
                </div>
                <div class="form-group"><label>最大步数</label><input type="number" id="cfgMaxSteps" min="1" max="50" value="6"></div>
                <div class="form-group">
                    <label>背景模式(测试)</label>
                    <select id="cfgBackdrop">
                        <option value="aurora">极光（iOS 26 液态玻璃）</option>
                        <option value="mica">Mica 云母（Win11）</option>
                        <option value="acrylic">Acrylic 亚克力（Win11）</option>
                        <option value="mica_alt">Mica Alt（Win11 标签页）</option>
                        <option value="custom">自定义图片</option>
                        <option value="none">纯色</option>
                    </select>
                </div>
                <div class="form-group" id="customBgGroup" style="display:none;">
                    <label>自定义背景图片</label>
                    <button id="btnPickBg">📁 选择图片</button>
                    <div style="font-size:11px;color:#666;margin-top:6px;" id="bgFileName">未选择</div>
                    <button id="btnClearBg" style="margin-top:6px;width:100%;height:30px;background:transparent;border:1px solid rgba(255,100,100,0.3);color:#ff6b6b;border-radius:8px;font-size:12px;cursor:pointer;">清除背景</button>
                </div>
            </div>
            <div class="settings-footer">
                <button class="btn-cancel" id="settingsCancel">取消</button>
                <button class="btn-save" id="settingsSave">保存</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        (function () {

        const $ = id => document.getElementById(id);

        let currentTaskId = null;
        let attachedItems = [];
        let attachedImage = null;
        let isRunning = false;
        let loadingMsgEl = null;
        const chats = {};

        function saveChats() {
        try {
        localStorage.setItem("ai_chats", JSON.stringify(chats));
        localStorage.setItem("ai_currentId", currentTaskId || "");
        } catch (e) {}
        }

        function loadChats() {
        try {
        const raw = localStorage.getItem("ai_chats");
        if (raw) {
        const parsed = JSON.parse(raw);
        Object.assign(chats, parsed);
        }
        currentTaskId = localStorage.getItem("ai_currentId") || null;
        if (currentTaskId && !chats[currentTaskId]) currentTaskId = null;
        } catch (e) {}
        }

        function send(obj) {
        if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(obj));
        }
        }

        function applyCustomBackground(dataUrl) {
        if (dataUrl) {
        document.body.style.setProperty('--custom-bg', 'url("' + dataUrl + '")');
        } else {
        document.body.style.removeProperty('--custom-bg');
        }
        }

        function setBackgroundMode(mode) {
        mode = mode || "aurora";
        document.body.className = "mode-" + mode;

        const g = $("customBgGroup");
        if (g) g.style.display = (mode === "custom") ? "block" : "none";

        if (mode === "custom") {
        const saved = localStorage.getItem("ai_custom_bg") || "";
        if (saved) {
        applyCustomBackground(saved);
        const nameEl = $("bgFileName");
        if (nameEl) nameEl.textContent = "已保存（" + Math.round(saved.length / 1024) + " KB）";
        } else {
        applyCustomBackground(null);
        const nameEl = $("bgFileName");
        if (nameEl) nameEl.textContent = "未选择";
        }
        } else {
        applyCustomBackground(null);
        }
        }

        $("btnMin").addEventListener("click", () => send({ type: "winMin" }));
        $("btnMax").addEventListener("click", () => send({ type: "winMax" }));
        $("btnClose").addEventListener("click", () => send({ type: "winClose" }));

        const titlebarEl = $("titlebar");
        let dragStartX = 0, dragStartY = 0, dragArmed = false;
        titlebarEl.addEventListener("mousedown", e => {
        if (e.target.closest(".win-btn")) return;
        if (e.button !== 0) return;
        dragStartX = e.clientX; dragStartY = e.clientY; dragArmed = true;
        });
        document.addEventListener("mousemove", e => {
        if (!dragArmed) return;
        if (Math.abs(e.clientX - dragStartX) + Math.abs(e.clientY - dragStartY) > 5) {
        dragArmed = false;
        send({ type: "winDrag" });
        }
        });
        document.addEventListener("mouseup", () => { dragArmed = false; });
        titlebarEl.addEventListener("dblclick", e => {
        if (e.target.closest(".win-btn")) return;
        send({ type: "winMax" });
        });

        $("toggleSidebar").addEventListener("click", () => $("sidebar").classList.toggle("collapsed"));
        $("toggleRight").addEventListener("click", () => $("rightPanel").classList.toggle("collapsed"));

        function createMessageEl(role, text, opts = {}) {
        const msg = document.createElement("div");
        msg.className = "message " + role;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "你" : "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (opts.error) bubble.classList.add("error");
        if (opts.image) {
        const img = document.createElement("img");
        img.src = opts.image;
        bubble.appendChild(img);
        }
        if (text) bubble.appendChild(document.createTextNode(text));

        if (role === "user") { msg.appendChild(bubble); msg.appendChild(avatar); }
        else { msg.appendChild(avatar); msg.appendChild(bubble); }
        return msg;
        }

        function createWin11Spinner() {
        const wrap = document.createElement("div");
        wrap.className = "win11-spinner";
        wrap.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>`;
        return wrap;
        }

        function addLoadingMessage(text = "AI 正在思考") {
        const container = $("messages");
        const msg = document.createElement("div");
        msg.className = "message ai";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble loading";
        bubble.appendChild(createWin11Spinner());

        const label = document.createElement("span");
        label.className = "loading-text";
        label.textContent = text;
        bubble.appendChild(label);

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        container.appendChild(msg);
        container.scrollTop = container.scrollHeight;

        loadingMsgEl = msg;
        }

        function removeLoadingMessage() {
        if (loadingMsgEl && loadingMsgEl.parentNode) {
        loadingMsgEl.parentNode.removeChild(loadingMsgEl);
        }
        loadingMsgEl = null;
        }

        function addMessage(role, text, opts = {}) {
        const container = $("messages");
        const el = createMessageEl(role, text, opts);
        container.appendChild(el);
        container.scrollTop = container.scrollHeight;

        if (currentTaskId) {
        if (!chats[currentTaskId]) {
        chats[currentTaskId] = {
        title: (text || "会话").substring(0, 30),
        time: new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" }),
        messages: []
        };
        }
        chats[currentTaskId].messages.push({
        role,
        text: text || "",
        image: opts.image || null,
        error: opts.error || false,
        ts: Date.now()
        });
        saveChats();
        }
        return el;
        }

        function clearMessages() {
        $("messages").innerHTML = "";
        loadingMsgEl = null;
        }

        function loadChat(id) {
        currentTaskId = id;
        clearMessages();

        const c = chats[id];
        if (c && c.messages) {
        for (const m of c.messages) {
        const opts = {};
        if (m.image) opts.image = m.image;
        if (m.error) opts.error = m.error;
        const el = createMessageEl(m.role, m.text, opts);
        $("messages").appendChild(el);
        }
        $("messages").scrollTop = $("messages").scrollHeight;
        }

        renderChatList();
        saveChats();
        }

        function deleteChat(id, e) {
        if (e) e.stopPropagation();
        if (!confirm("确定删除这个会话？")) return;
        delete chats[id];
        if (currentTaskId === id) {
        currentTaskId = null;
        clearMessages();
        }
        renderChatList();
        saveChats();
        }

        function appendLog(level, text) {
        const logEl = $("log");
        const div = document.createElement("div");
        div.className = "log-line " + (level || "info");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        div.innerHTML = '<span class="ts">' + t + '</span><span class="msg"></span>';
        div.querySelector(".msg").textContent = text;
        logEl.appendChild(div);
        while (logEl.childElementCount > 300) logEl.removeChild(logEl.firstChild);
        logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(dotClass) {
        $("statusDot").className = "status-dot" + (dotClass ? " " + dotClass : "");
        }

        function setRunning(running) {
        isRunning = running;
        const btn = $("sendBtn");
        if (running) {
        btn.className = "send-btn stop";
        btn.innerHTML = "&#xE71A;";
        btn.title = "Stop";
        setStatus("running");
        } else {
        btn.className = "send-btn";
        btn.innerHTML = "&#xE724;";
        btn.title = "Send";
        }
        }

        function onPickedItems(items) {
        if (!Array.isArray(items)) return;
        for (const it of items) {
        if (attachedItems.some(x => x.path === it.path)) continue;
        attachedItems.push(it);
        }
        renderAttachments();
        send({ type: "setAttachments", paths: attachedItems.map(x => x.path) });
        }

        function renderAttachments() {
        const list = $("attachList");
        list.innerHTML = "";
        if (attachedImage) {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        chip.innerHTML = `<span>🖼</span><span class="name"></span><span class="x">×</span>`;
        chip.querySelector(".name").textContent = attachedImage.name;
        chip.querySelector(".x").addEventListener("click", () => {
        attachedImage = null;
        renderAttachments();
        });
        list.appendChild(chip);
        }
        for (let i = 0; i < attachedItems.length; i++) {
        const it = attachedItems[i];
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        const icon = it.type === "folder" ? "📁" : "📄";
        chip.innerHTML = `<span>${icon}</span><span class="name"></span><span class="x">×</span>`;
        chip.querySelector(".name").textContent = it.name;
        chip.querySelector(".x").addEventListener("click", () => {
        attachedItems.splice(i, 1);
        renderAttachments();
        send({ type: "setAttachments", paths: attachedItems.map(x => x.path) });
        });
        list.appendChild(chip);
        }
        }

        $("btnAttach").addEventListener("click", () => send({ type: "pickFiles" }));
        $("btnPickFolder").addEventListener("click", () => send({ type: "pickFolder" }));

        $("btnImage").addEventListener("click", () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
        const base64 = reader.result.split(",")[1];
        attachedImage = { name: file.name, b64: base64 };
        renderAttachments();
        send({ type: "attachImage", name: file.name, b64: base64 });
        appendLog("info", "已上传图片: " + file.name);
        };
        reader.readAsDataURL(file);
        };
        input.click();
        });

        function sendTask() {
        const input = $("taskInput");
        const task = input.value.trim();

        if (isRunning) {
        appendLog("info", "用户请求停止");
        send({ type: "stop" });
        return;
        }

        if (!task && !attachedImage) { input.focus(); return; }

        if (!currentTaskId) {
        currentTaskId = "chat_" + Date.now();
        chats[currentTaskId] = {
        title: (task || "图片提问").substring(0, 30),
        time: new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" }),
        messages: []
        };
        renderChatList();
        }

        if (attachedImage) {
        addMessage("user", task, { image: "data:image/png;base64," + attachedImage.b64 });
        } else {
        addMessage("user", task);
        }

        input.value = "";
        input.style.height = "24px";
        $("log").innerHTML = "";

        setRunning(true);
        addLoadingMessage("AI 正在思考");

        send({ type: "runTask", task: task || "请描述这张图片" });

        attachedImage = null;
        renderAttachments();
        saveChats();
        }

        function renderChatList() {
        const list = $("chatList");
        list.innerHTML = "";
        const ids = Object.keys(chats).sort((a, b) => {
        const ta = chats[a].messages?.[0]?.ts || 0;
        const tb = chats[b].messages?.[0]?.ts || 0;
        return tb - ta;
        });
        for (const id of ids) {
        const c = chats[id];
        const item = document.createElement("div");
        item.className = "chat-item" + (id === currentTaskId ? " active" : "");
        item.innerHTML = `<span></span><span class="time"></span><span class="del">×</span>`;
        item.querySelector("span").textContent = c.title;
        item.querySelector(".time").textContent = c.time;
        item.querySelector(".del").addEventListener("click", (e) => deleteChat(id, e));
        item.addEventListener("click", () => loadChat(id));
        list.appendChild(item);
        }
        }

        $("newChat").addEventListener("click", () => {
        currentTaskId = null;
        clearMessages();
        $("log").innerHTML = "";
        $("taskInput").value = "";
        $("taskInput").focus();
        renderChatList();
        setStatus("");
        setRunning(false);
        saveChats();
        });

        const PROVIDERS = {
        qwen: {
        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",
        models: ["qwen-vl-max", "qwen-vl-plus"]
        },
        zhipu: {
        base_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions",
        models: ["glm-4v-plus", "glm-4v"]
        },
        deepseek: {
        base_url: "https://api.deepseek.com/v1/chat/completions",
        models: ["deepseek-chat", "deepseek-vl"]
        },
        openai: {
        base_url: "https://api.openai.com/v1/chat/completions",
        models: ["gpt-4o", "gpt-4o-mini"]
        },
        moonshot: {
        base_url: "https://api.moonshot.cn/v1/chat/completions",
        models: ["moonshot-v1-8k-vision-preview"]
        },
        custom: { base_url: "", models: [] }
        };

        const settingsMask = $("settingsMask");
        const cfgProvider = $("cfgProvider");
        const cfgApiKey = $("cfgApiKey");
        const cfgBaseUrl = $("cfgBaseUrl");
        const cfgModel = $("cfgModel");
        const cfgMaxSteps = $("cfgMaxSteps");
        const cfgBackdrop = $("cfgBackdrop");
        const modelList = $("modelList");

        function updateModelList() {
        const p = PROVIDERS[cfgProvider.value];
        if (!p) return;
        modelList.innerHTML = "";
        p.models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        modelList.appendChild(opt);
        });
        if (p.base_url && cfgProvider.value !== "custom") cfgBaseUrl.value = p.base_url;
        if (p.models.length && cfgProvider.value !== "custom") cfgModel.value = p.models[0];
        }
        cfgProvider.addEventListener("change", updateModelList);

        function openSettings() {
        send({ type: "getConfig" });
        settingsMask.style.display = "flex";
        }
        function closeSettings() { settingsMask.style.display = "none"; }

        $("btnSettings").addEventListener("click", openSettings);
        $("settingsClose").addEventListener("click", closeSettings);
        $("settingsCancel").addEventListener("click", closeSettings);
        settingsMask.addEventListener("click", e => { if (e.target === settingsMask) closeSettings(); });

        // ★ 选择自定义背景（带压缩）
        $("btnPickBg").addEventListener("click", () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = () => {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
        const img = new Image();
        img.onload = () => {
        // 压缩到最大宽 1920
        const MAX_W = 1920;
        let w = img.width;
        let h = img.height;
        if (w > MAX_W) {
        h = Math.round(h * MAX_W / w);
        w = MAX_W;
        }

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);

        // JPEG 0.7 质量
        const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

        // 尝试存 localStorage
        try {
        localStorage.setItem("ai_custom_bg", dataUrl);
        } catch (e) {
        // 存储满了 → 清最旧会话
        if (confirm("存储空间不足，是否清理旧会话？")) {
        const keys = Object.keys(chats).sort((a, b) => {
        return (chats[a].messages?.[0]?.ts || 0) -
        (chats[b].messages?.[0]?.ts || 0);
        });
        for (let i = 0; i < Math.min(3, keys.length); i++) {
        delete chats[keys[i]];
        }
        saveChats();
        try {
        localStorage.setItem("ai_custom_bg", dataUrl);
        } catch (e2) {
        alert("仍然太大，请用更小的图片。");
        return;
        }
        } else {
        return;
        }
        }

        applyCustomBackground(dataUrl);
        const nameEl = $("bgFileName");
        if (nameEl) {
        nameEl.textContent = file.name + "（压缩后 " +
        Math.round(dataUrl.length / 1024) + " KB）";
        }
        };
        img.src = reader.result;
        };
        reader.readAsDataURL(file);
        };
        input.click();
        });

        // ★ 清除背景
        $("btnClearBg").addEventListener("click", () => {
        if (!confirm("确定清除自定义背景？")) return;
        localStorage.removeItem("ai_custom_bg");
        applyCustomBackground(null);
        const nameEl = $("bgFileName");
        if (nameEl) nameEl.textContent = "未选择";
        });

        $("settingsSave").addEventListener("click", () => {
        send({
        type: "saveConfig",
        provider: cfgProvider.value,
        api_key: cfgApiKey.value.trim(),
        base_url: cfgBaseUrl.value.trim(),
        model: cfgModel.value.trim(),
        max_steps: parseInt(cfgMaxSteps.value) || 6,
        backdrop: cfgBackdrop.value
        });
        setBackgroundMode(cfgBackdrop.value);
        closeSettings();
        if (cfgModel.value) $("modelName").textContent = cfgModel.value;
        });

        $("cfgBackdrop").addEventListener("change", () => {
        setBackgroundMode(cfgBackdrop.value);
        });

        function onConfigLoaded(cfg) {
        cfgProvider.value = cfg.provider || "qwen";
        cfgApiKey.value = cfg.api_key || "";
        cfgMaxSteps.value = cfg.max_steps || 6;
        cfgBackdrop.value = cfg.backdrop || "aurora";
        setBackgroundMode(cfg.backdrop || "aurora");
        const p = PROVIDERS[cfgProvider.value];
        if (p) {
        modelList.innerHTML = "";
        p.models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        modelList.appendChild(opt);
        });
        }
        cfgBaseUrl.value = cfg.base_url || (p && p.base_url) || "";
        cfgModel.value = cfg.model || (p && p.models[0]) || "";
        if (cfgModel.value) $("modelName").textContent = cfgModel.value;
        }

        function parseMessage(data) {
        if (typeof data === "string") {
        try { return JSON.parse(data); } catch (err) { return null; }
        }
        return data;
        }

        if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener("message", e => {
        const m = parseMessage(e.data);
        if (!m) return;

        try {
        switch (m.type) {
        case "log":
        appendLog(m.level, m.text);
        break;
        case "step":
        break;
        case "aiReply":
        removeLoadingMessage();
        setRunning(false);
        addMessage("ai", m.text || "(空)");
        setStatus("done");
        break;
        case "done":
        removeLoadingMessage();
        setRunning(false);
        if (m.success) {
        setStatus("done");
        addMessage("ai", "✓ 任务完成");
        } else {
        setStatus("error");
        addMessage("ai", "✗ 任务失败: " + (m.reason || "unknown"), { error: true });
        }
        break;
        case "aiError":
        removeLoadingMessage();
        setRunning(false);
        addMessage("ai", "⚠ AI 调用失败: " + (m.message || "unknown"), { error: true });
        setStatus("error");
        break;
        case "config":
        onConfigLoaded(m);
        break;
        case "pickedItems":
        onPickedItems(m.items);
        break;
        }
        } catch (err) {
        console.error("[UI] handle error:", err);
        }
        });
        }

        const taskInput = $("taskInput");
        taskInput.addEventListener("input", () => {
        taskInput.style.height = "24px";
        taskInput.style.height = Math.min(taskInput.scrollHeight, 200) + "px";
        });
        taskInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        sendTask();
        }
        });

        $("sendBtn").addEventListener("click", sendTask);

        appendLog("info", "前端就绪");
        setTimeout(() => send({ type: "getConfig" }), 300);

        loadChats();
        renderChatList();

        if (currentTaskId && chats[currentTaskId]) {
        loadChat(currentTaskId);
        } else {
        addMessage("ai", "你好！我是 AI 自动化助手。\n\n你可以：\n• 让我操作电脑：'打开浏览器' / '创建 excel'\n• 上传图片提问：点 📷 上传\n• 直接问我问题：'什么是 python'");
        }

        setBackgroundMode("aurora");

        })();
    </script>
</body>
</html>
